[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowlite"
version = "0.1.0"
description = "Streaming voice dictation demo: faster-whisper + small-LLM cleanup, with latency and edit-rate benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harshal Shirke" }]
dependencies = ["numpy>=1.24", "httpx>=0.25"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0", "sounddevice>=0.4"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4"]
all = ["flowlite[asr,server,dev]"]

[project.scripts]
flowlite = "flowlite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowlite = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
